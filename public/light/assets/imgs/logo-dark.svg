<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none" width="280" height="48">
  <!-- MAXY — bold, wide-tracked uppercase, dark version (for light backgrounds) -->
  <text
    x="0"
    y="36"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="3"
    fill="#0a0a0a"
  >MAXY</text>

  <!-- Thin gold divider -->
  <rect x="136" y="8" width="1.2" height="30" fill="#fcb92a" opacity="0.9"/>

  <!-- Digital — light weight, all-caps small -->
  <text
    x="147"
    y="32"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-size="13"
    font-weight="300"
    letter-spacing="4"
    fill="#0a0a0a"
    opacity="0.75"
  >DIGITAL</text>
</svg>
